<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>Realtime Chat</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="sidebar">

    <h1>Chat App</h1>

    <div class="auth-box">

      <input
        type="email"
        id="email"
        placeholder="Email"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
      />

      <input
        type="text"
        id="username"
        placeholder="Username"
      />

      <button id="signupBtn">
        Sign Up
      </button>

      <button id="loginBtn">
        Login
      </button>

      <button id="logoutBtn">
        Logout
      </button>

    </div>

    <div class="status">
      <span id="statusText">
        Not logged in
      </span>
    </div>

  </div>

  <div class="chat-container">

    <div class="chat-header">
      Global Chat
    </div>

    <div id="messages"
         class="messages"></div>

    <div class="message-input-container">

      <input
        type="text"
        id="messageInput"
        placeholder="Message..."
      />

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

</div>

<script type="module"
        src="app.js"></script>

</body>
</html>
