<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Realtime Chat</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <h1>Chat App</h1>

    <div id="status">
      Not logged in
    </div>

    <div class="auth">

      <input
        id="email"
        type="email"
        placeholder="Email"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
      />

      <input
        id="username"
        type="text"
        placeholder="Username"
      />

      <button id="signupBtn">
        Sign Up
      </button>

      <button id="loginBtn">
        Login
      </button>

      <button id="logoutBtn">
        Logout
      </button>

    </div>

  </div>

  <!-- CHAT -->

  <div class="chat-container">

    <div class="chat-header">
      Global Chat
    </div>

    <div id="messages" class="messages"></div>

    <div class="bottom">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
      />

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
