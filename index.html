```html
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Realtime Chat</title>

  <link rel="stylesheet" href="style.css" />

</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <h1>Chat App</h1>

    <div id="status">
      Not logged in
    </div>

    <div class="auth">

      <input
        id="email"
        type="email"
        placeholder="Email"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
      />

      <input
        id="username"
        type="text"
        placeholder="Username"
      />

      <button id="signupBtn">
        Sign Up
      </button>

      <button id="loginBtn">
        Login
      </button>

      <button id="logoutBtn">
        Logout
      </button>

    </div>

  </aside>

  <!-- CHAT -->

  <main class="chat-container">

    <div class="chat-header">
      Multi Room Chat
    </div>

    <!-- ROOMS -->

    <div class="rooms">

      <button
        class="room-btn active"
        data-room="global"
      >
        # Global
      </button>

      <button
        class="room-btn"
        data-room="gaming"
      >
        # Gaming
      </button>

      <button
        class="room-btn"
        data-room="music"
      >
        # Music
      </button>

      <button
        class="room-btn"
        data-room="coding"
      >
        # Coding
      </button>

    </div>

    <!-- MESSAGES -->

    <div
      id="messages"
      class="messages"
    ></div>

    <!-- INPUT -->

    <div class="bottom">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
      />

      <button id="sendBtn">
        Send
      </button>

    </div>

  </main>

</div>

<script
  type="module"
  src="app.js"
></script>

</body>
</html>
```
